server:
  port: 8080

spring:
  application:
    name: hotelReservation
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/hotel_reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    elasticsearch:
      enabled: false

hotel:
  jwt:
    secret: "hotel-reservation-demo-jwt-hmac-secret-at-least-32-bytes-long"
    expire-hours: 24
  order:
    pay-timeout-minutes: 30
    free-cancel-hours: 24
  inventory:
    calendar-days: 90
  search:
    index: hotels
  cache:
    enabled: true
    search-ttl-seconds: 45
    static-ttl-seconds: 1800
    quote-ttl-seconds: 30
    calendar-ttl-seconds: 20
    compare-ttl-seconds: 86400
    null-object-ttl-seconds: 120
    ttl-jitter-seconds: 15
    lock-ttl-seconds: 5
    lock-wait-millis: 40
    lock-wait-retries: 5

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    org.example.hotelreservation: INFO
    org.springframework.amqp: WARN
    org.elasticsearch: WARN
